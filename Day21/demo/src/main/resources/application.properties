spring.application.name=demo
server.port=8080

# ===== H2 In-Memory Veritabanı =====
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# ===== H2 Console =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== data.sql =====
# Spring Boot 2.5+ data.sql'i Hibernate tabloyu oluşturmadan ÖNCE çalıştırıyor.
# Bu satır olmazsa "Table PRODUCTS not found" hatası alınıyor.
spring.jpa.defer-datasource-initialization=true
# "Kırtasiye" gibi Türkçe karakterler Windows'ta bozulmasın diye
spring.sql.init.encoding=UTF-8

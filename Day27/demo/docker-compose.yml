# MySQL'i bilgisayara kurmadan Docker ile çalıştırmak için (isteğe bağlı).
# 1) .env.example dosyasını .env olarak kopyala ve şifreyi yaz
# 2) docker compose up -d
# 3) Uygulamayı aynı DB_PASSWORD ortam değişkeniyle başlat
services:
  mysql:
    image: mysql:8.4
    container_name: egitim-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: egitimdb     # CREATE DATABASE egitimdb; komutunu kendisi çalıştırıyor
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql  # container silinse bile veri kalıyor

volumes:
  mysql-data:

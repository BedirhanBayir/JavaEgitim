spring.application.name=demo
server.port=8080

# ===== MySQL =====
# jdbc:mysql://<sunucu>:<port>/<veritabanı>?<ayarlar>
spring.datasource.url=jdbc:mysql://localhost:3306/egitimdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Şifre koda yazılmıyor, ortam değişkeninden (environment variable) okunuyor.
# IntelliJ: Run > Edit Configurations > Environment variables > DB_PASSWORD=...
# DB_USERNAME verilmezse "root" kullanılıyor.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# Dialect yazılmadı: Hibernate 6 bağlandığı veritabanından MySQL olduğunu kendisi anlıyor.
# update: tablo yoksa oluştur, varsa koru (veriyi silme), eksik sütunları ekle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# data.sql kaldırıldı: ddl-auto=update ile tablo silinmediği için her açılışta
# aynı 5 ürün tekrar eklenirdi. Başlangıç verisini config/DataLoader ekliyor
# (sadece tablo boşsa).
